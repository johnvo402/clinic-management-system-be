services:
  database:
    container_name: database
    image: postgis/postgis:14-master
    restart: always
    command:
      - "-cshared_preload_libraries=pg_stat_statements"
      - "-cpg_stat_statements.max=10000"
      - "-cpg_stat_statements.track=all"
      - "-cmax_connections=200"
    volumes:
      - db_data:/var/lib/postgresql/data
      # - ./scripts/bootstrap:/bootstrap:ro
      - ./scripts/docker-entrypoint-initdb.d/000_createdb.sql:/docker-entrypoint-initdb.d/000_createdb.sql
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    shm_size: ${POSTGRES_SHM_SIZE}

  auth:
    container_name: auth
    image: auth
    ports:
      - "8080"
    depends_on:
      - "database"
    restart: always

volumes:
  db_data:
